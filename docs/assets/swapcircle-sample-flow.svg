<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title description"><title id="title">SwapCircle sample: 2 to 6 to 2 to 5 matched readers.</title><desc id="description">Four illustrated stages show an authored six-reader fixture. A direct pair, a new four-person circle, a withdrawal, then a repaired three-person circle. Reading choices are separate from exact-trade approvals. Illustrative sample. Authored rankings and simulated responses.</desc><defs>
