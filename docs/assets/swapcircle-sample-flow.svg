</defs><rect width="1600" height="900" fill="#f6f3eb"/><g fill="#24372d" font-family="Arial, Helvetica, sans-serif"><g transform="translate(70,51) scale(0.9)"><circle cx="18" cy="18" r="18" fill="#2d5942"/><path d="M27 10A12 12 0 1 0 28 25M27 5V12H20" fill="none" stroke="#f6f3eb" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="49" y="27" font-size="27" font-weight="700" letter-spacing="-1.3">SwapCircle</text><circle cx="193" cy="24" r="3" fill="#ba8650"/></g><text x="1530" y="76" font-size="12" text-anchor="end" letter-spacing="2" fill="#73786c">THE SAMPLE, STEP BY STEP</text><line x1="70" y1="114" x2="1530" y2="114" stroke="#dedfd2" stroke-width="1" /><text x="68" y="195" font-size="63" font-family="Georgia, serif" letter-spacing="-2.4">One answer can close a circle.</text><text x="71" y="244" font-size="21" fill="#626f60">Each matched reader gives one book and receives one. Every exact exchange still needs approval.</text><rect x="70" y="294" width="334" height="426" rx="10" fill="#fffcf6" stroke="#dedfd2"/><text x="94" y="329" font-size="12" letter-spacing="1.4" fill="#8b957e">01</text><text x="95" y="410" font-size="76" font-family="Georgia, serif" letter-spacing="-3" fill="#2d5942">2</text><text x="161" y="396" font-size="14" fill="#73786c">matched</text><text x="161" y="416" font-size="14" fill="#73786c">readers</text><text x="95" y="458" font-size="22" font-family="Georgia, serif" letter-spacing="-.4">A direct swap</text><text x="95" y="487" font-size="14" fill="#73786c">Iris and Sam form a pair.</text><circle cx="150" cy="538" r="20" fill="#f0eee5" stroke="#d7d9ca" stroke-width="1.2" /><text x="150" y="543" font-size="13" text-anchor="middle" font-weight="600" fill="#9a9e8e">M</text><circle cx="320" cy="538" r="20" fill="#f0eee5" stroke="#d7d9ca" stroke-width="1.2" /><text x="320" y="543" font-size="13" text-anchor="middle" font-weight="600" fill="#9a9e8e">L</text><circle cx="320" cy="605" r="20" fill="#f0eee5" stroke="#d7d9ca" st