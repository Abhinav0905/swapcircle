stroke-linecap="round" stroke-linejoin="round"/><path d="M1163 399H1183M1176 392L1183 399L1176 406" fill="none" stroke="#8d997f" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><text x="70" y="759" font-size="14" fill="#73786c">M Maya / L Leo / N Noor / J Jules / I Iris / S Sam</text><text x="1530" y="759" font-size="14" text-anchor="end" fill="#73786c">Arrows show book handoffs. Iris and Sam keep their unchanged pair.</text><rect x="70" y="794" width="1460" height="60" rx="7" fill="#e8ede1"/><text x="91" y="819" font-size="16" font-weight="600" fill="#44573e">Illustrative sample. Authored rankings and simulated responses.</text><text x="91" y="843" font-size="14" fill="#637159">Changed circles need fresh approvals. These counts describe this fixture, not measured reader benefit.</text></g></svg>