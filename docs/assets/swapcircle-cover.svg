<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title description"><title id="title">SwapCircle — Good books, full circle.</title><desc id="description">Original illustrated book forms form a circle. Taste leads to choice, then approval. This is a cover graphic, not an application screenshot.</desc><defs>
