name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      origin_probe:
        description: Run eight local transport cases instead of the normal smoke
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: "true"
      npm_config_registry: https://registry.npmjs.org
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Install locked dependencies
        run: npm run install:ci
      - name: Check types, tests and build
        if: ${{ !inputs.origin_probe }}
        run: npm run verify
      - name: Build for the targeted transport probe
        if: ${{ inputs.origin_probe }}
        run: npm run build
      - name: Apply local D1 migration
        run: node --import ./scripts/sites-env.mjs ./node_modules/wrangler/bin/wrangler.js d1 execute DB --local --config dist/server/wrangler.json --persist-to .wrangler/state --file drizzle/0000_noisy_sabretooth.sql
      - name: Classify local proxy failures without logging request data
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";
          const path = "node_modules/wrangler/wrangler-dist/ProxyWorker.js";
          const source = readFileSync(path, "utf8");
          const anchor = "const newUserWorkerUrl = this.proxyData && urlFromParts(this.proxyData.userWorkerUrl);";
          if (source.split(anchor).length !== 2) throw new Error("The pinned Wrangler proxy changed; review its diagnostic hook.");
          const diagnostic = `
                  const categories = [
                    [/never generate a response|unresolved promise/i, "unresolved-response"],
                    [/different request|request context|io context/i, "request-context"],
                    [/content.length|body.*(?:length|stream|ended)/i, "request-body"],
                    [/network connection lost|econnreset|econnrefused|epipe|socket|disconnected/i, "connection-lost"],
                    [/cancel|abort/i, "canceled"],
                    [/cpu|memory limit|out of memory/i, "resource-limit"],
                    [/timed? ?out|timeout/i, "timeout"],
                    [/fetch failed/i, "fetch-failed"],
                  ];
                  const category = categories.find(([pattern]) => pattern.test(String(error?.message ?? "")))?.[1] ?? "other";
                  const name = ["Error", "TypeError", "AbortError", "TimeoutError", "DOMException"].includes(error?.name) ? error.name : "OtherError";
                  const sameUpstream = newUserWorkerUrl?.origin === userWorkerUrl.origin;
                  console.error("SWAPCIRCLE_PROXY_FAILURE " + category + " " + name + " same-upstream=" + sameUpstream);
          `;
          writeFileSync(path, source.replace(anchor, anchor + diagnostic));
          NODE
      - name: Smoke the built Worker
        shell: bash
        run: |
          mkdir -p .sites-runtime
          npm start -- --port 8787 > .sites-runtime/ci-worker.log 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid" 2>/dev/null || true' EXIT
          if [ "${{ inputs.origin_probe }}" = "true" ]; then
            npm run smoke -- http://127.0.0.1:8787 --worker-log=.sites-runtime/ci-worker.log --origin-probe
          else
            npm run smoke -- http://127.0.0.1:8787 --worker-log=.sites-runtime/ci-worker.log
          fi
      - name: Retain safe Worker diagnostics on failure
        if: failure() || inputs.origin_probe
        uses: actions/upload-artifact@v7
        with:
          name: worker-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: .sites-runtime/ci-worker.log.safe.txt
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7
